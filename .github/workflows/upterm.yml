name: Upterm

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          limit-access-to-actor: false
          wait-timeout-minutes: 360

      - name: Publish session command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "upterm session $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "${{ steps.upterm.outputs.ssh-command }}"

      - name: Keep session alive
        run: sleep 21600
